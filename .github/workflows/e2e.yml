name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npm run build
      
      - name: 📸 Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: 🧪 Run E2E tests
        run: npm run test:e2e
