site_name: DevToolbox Docs
site_description: Architecture, design system, and roadmap for Toolbox4Devs
site_url: https://goldi0002.github.io/devtoolbox/
repo_url: https://github.com/goldi0002/devtoolbox
repo_name: goldi0002/devtoolbox
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
